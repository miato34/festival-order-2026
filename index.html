<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 관리 - 융융죽겠지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">

    <div class="max-w-7xl mx-auto">
        <!-- 헤더 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-700">
            <div>
                <h1 class="text-3xl font-extrabold text-yellow-400">융융죽겠지 🍻 주문 관리 시스템</h1>
                <p class="text-gray-400 text-sm mt-1">실시간 주문 현황 대시보드</p>
            </div>
            <!-- 날짜 탭 -->
            <div id="day-tabs" class="flex space-x-2 mt-4 md:mt-0">
                <button data-day="day1" class="day-tab bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-500">Day 1 (9/30)</button>
                <button data-day="day2" class="day-tab bg-gray-700 text-gray-300 px-4 py-2 rounded-lg font-bold hover:bg-indigo-500">Day 2 (10/1)</button>
                <button data-day="day3" class="day-tab bg-gray-700 text-gray-300 px-4 py-2 rounded-lg font-bold hover:bg-indigo-500">Day 3 (10/2)</button>
            </div>
        </header>

        <!-- 요약 정보 바 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
                <p class="text-gray-400 text-sm">접수 중 주문</p>
                <p id="stat-pending" class="text-3xl font-bold text-red-400 mt-1">0건</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
                <p class="text-gray-400 text-sm">요리/서빙 중</p>
                <p id="stat-cooking" class="text-3xl font-bold text-yellow-400 mt-1">0건</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
                <p class="text-gray-400 text-sm">총 주문 건수</p>
                <p id="stat-total-count" class="text-3xl font-bold text-blue-400 mt-1">0건</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
                <p class="text-gray-400 text-sm">총 매출액</p>
                <p id="stat-total-sales" class="text-3xl font-bold text-green-400 mt-1">0원</p>
            </div>
        </div>

        <!-- 주문 목록 리스트 -->
        <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <p id="loading-msg" class="text-gray-400 col-span-full text-center py-10">주문 데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAh7xMGv5-J8pQ4iRKMUdgwYWjHl-EyLo8",
            authDomain: "fest-42034.firebaseapp.com",
            databaseURL: "https://fest-42034-default-rtdb.firebaseio.com",
            projectId: "fest-42034",
            storageBucket: "fest-42034.firebasestorage.app",
            messagingSenderId: "406022882583",
            appId: "1:406022882583:web:bea2caf8052bf6f02a6352",
            measurementId: "G-ZS4777HWQ1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentActiveDay = "day1";

        // 날짜 자동 감지 (축제 당일 자동 맞춤)
        const todayStr = new Date().toISOString().split('T')[0];
        if (todayStr === "2026-10-01") currentActiveDay = "day2";
        else if (todayStr === "2026-10-02") currentActiveDay = "day3";

        // 날짜 탭 UI 업데이트
        function updateTabUI() {
            document.querySelectorAll('.day-tab').forEach(btn => {
                if (btn.dataset.day === currentActiveDay) {
                    btn.className = "day-tab bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-500";
                } else {
                    btn.className = "day-tab bg-gray-700 text-gray-300 px-4 py-2 rounded-lg font-bold hover:bg-indigo-500";
                }
            });
        }
        updateTabUI();

        document.querySelectorAll('.day-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentActiveDay = e.target.dataset.day;
                updateTabUI();
                listenToOrders();
            });
        });

        // 실시간 주문 수신 및 화면 표시
        function listenToOrders() {
            const ordersRef = ref(db, 'orders');
            onValue(ordersRef, (snapshot) => {
                const container = document.getElementById('orders-container');
                container.innerHTML = '';

                if (!snapshot.exists()) {
                    container.innerHTML = '<p class="text-gray-400 col-span-full text-center py-10">접수된 주문이 없습니다.</p>';
                    updateStats([]);
                    return;
                }

                const allOrdersData = snapshot.val();
                const currentDayOrders = [];

                for (const key in allOrdersData) {
                    const order = { id: key, ...allOrdersData[key] };
                    if (order.festivalDay === currentActiveDay) {
                        currentDayOrders.push(order);
                    }
                }

                // 최근 주문이 위로 오도록 정렬
                currentDayOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                updateStats(currentDayOrders);

                if (currentDayOrders.length === 0) {
                    container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-10">${currentActiveDay.toUpperCase()}에 접수된 주문이 없습니다.</p>`;
                    return;
                }

                currentDayOrders.forEach(order => {
                    const card = createOrderCard(order);
                    container.appendChild(card);
                });
            });
        }

        function createOrderCard(order) {
            const card = document.createElement('div');
            card.className = "bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-lg flex flex-col justify-between";

            const timeStr = new Date(order.timestamp).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            let statusBadgeColor = "bg-red-500 text-white";
            if (order.status === "요리 중") statusBadgeColor = "bg-yellow-500 text-black";
            if (order.status === "서빙 완료") statusBadgeColor = "bg-blue-500 text-white";
            if (order.status === "결제 완료") statusBadgeColor = "bg-green-600 text-white";

            let itemsHtml = '';
            if (order.orderBatches && order.orderBatches.length > 0) {
                order.orderBatches.forEach((batch, idx) => {
                    itemsHtml += `<div class="mt-2 pt-2 border-t border-gray-700"><span class="text-xs text-indigo-400 font-bold">[주문 차수 ${idx + 1}]</span><ul class="mt-1 space-y-1">`;
                    batch.items.forEach(item => {
                        itemsHtml += `<li class="flex justify-between text-sm"><span class="font-medium text-gray-200">${item.name} x ${item.quantity}</span><span class="text-gray-400">${(item.price * item.quantity).toLocaleString()}원</span></li>`;
                    });
                    itemsHtml += `</ul></div>`;
                });
            } else if (order.items) {
                itemsHtml += `<ul class="mt-2 space-y-1">`;
                order.items.forEach(item => {
                    itemsHtml += `<li class="flex justify-between text-sm"><span class="font-medium text-gray-200">${item.name} x ${item.quantity}</span><span class="text-gray-400">${(item.price * item.quantity).toLocaleString()}원</span></li>`;
                });
                itemsHtml += `</ul>`;
            }

            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-2xl font-black text-yellow-300">테이블 ${order.tableNumber}번</span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${statusBadgeColor}">${order.status}</span>
                    </div>
                    <p class="text-xs text-gray-400 mb-2">주문 시간: ${timeStr}</p>
                    <div class="bg-gray-900 rounded-lg p-3 my-2">${itemsHtml}</div>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-700">
                        <span class="font-bold text-gray-300">총 금액:</span>
                        <span class="text-xl font-black text-green-400">${(order.totalPrice || 0).toLocaleString()}원</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-4 pt-2 border-t border-gray-700">
                    <button onclick="changeStatus('${order.id}', '요리 중')" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 px-2 rounded text-xs">요리 중</button>
                    <button onclick="changeStatus('${order.id}', '서빙 완료')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-2 rounded text-xs">서빙 완료</button>
                    <button onclick="changeStatus('${order.id}', '결제 완료')" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-2 rounded text-xs col-span-2">💰 결제 완료 (퇴장)</button>
                    <button onclick="deleteOrder('${order.id}')" class="bg-red-900 hover:bg-red-800 text-red-200 text-xs py-1 rounded col-span-2 mt-1">주문 취소/삭제</button>
                </div>
            `;
            return card;
        }

        // 통계 수치 업데이트
        function updateStats(orders) {
            const pending = orders.filter(o => o.status === "주문 접수 중").length;
            const cooking = orders.filter(o => o.status === "요리 중" || o.status === "서빙 완료").length;
            const totalCount = orders.length;
            const totalSales = orders.reduce((sum, o) => sum + (o.totalPrice || 0), 0);

            document.getElementById('stat-pending').textContent = `${pending}건`;
            document.getElementById('stat-cooking').textContent = `${cooking}건`;
            document.getElementById('stat-total-count').textContent = `${totalCount}건`;
            document.getElementById('stat-total-sales').textContent = `${totalSales.toLocaleString()}원`;
        }

        // 상태 변경 함수
        window.changeStatus = async function(orderId, newStatus) {
            try {
                const orderRef = ref(db, `orders/${orderId}`);
                await update(orderRef, { status: newStatus });
            } catch (e) {
                alert(`상태 변경 실패: ${e.message}`);
            }
        };

        // 주문 삭제 함수
        window.deleteOrder = async function(orderId) {
            if (confirm("정말로 이 주문을 취소/삭제하시겠습니까?")) {
                try {
                    const orderRef = ref(db, `orders/${orderId}`);
                    await remove(orderRef);
                } catch (e) {
                    alert(`삭제 실패: ${e.message}`);
                }
            }
        };

        // 초기 수신 시작
        listenToOrders();
    </script>
</body>
</html>
